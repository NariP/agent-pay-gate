# Free hosting puts the demo to sleep after about 15 idle minutes.
# This pings it every 10 minutes so the first visitor does not wait for a cold start.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 -o /dev/null -w "status %{http_code} in %{time_total}s\n" https://agent-pay-gate.onrender.com/healthz
